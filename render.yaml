# Render Blueprint: the API and its database, deployed together.
# In the Render dashboard: New → Blueprint → pick this repo.
services:
  - type: web
    name: todo-api
    runtime: docker
    rootDir: server # build server/Dockerfile with server/ as the context
    region: singapore # must match the database, so they share the private network
    plan: free
    branch: develop # the live branch; switch to main after the PR is merged
    autoDeployTrigger: checksPass # deploy only once GitHub Actions is green
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: todo-db
          property: connectionString # private-network URL; config.py adds the psycopg driver
      - key: LOG_FORMAT
        value: json

databases:
  - name: todo-db
    region: singapore
    plan: free # note: Render deletes free databases after 30 days
    databaseName: todo
    user: todo
    ipAllowList: [] # no public access; only services on Render's private network can connect
